name: SetPoint

options:
  bundleIdPrefix: com.setpoint
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  SetPoint:
    type: application
    platform: iOS
    sources:
      - path: SetPoint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.setpoint.app
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "SetPoint reads your heart-rate variability and resting heart rate to notice when you may be under-fuelled and prompt you to eat."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo of a meal to log it."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attach a photo of a meal to log it."
    entitlements:
      path: SetPoint/SetPoint.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default

  SetPointTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SetPointTests
    dependencies:
      - target: SetPoint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.setpoint.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SetPoint:
    build:
      targets:
        SetPoint: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SetPointTests
