name: SetPoint

options:
  bundleIdPrefix: com.setpoint
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.28.0

targets:
  SetPoint:
    type: application
    platform: iOS
    sources:
      - path: SetPoint
        excludes:
          - Info.plist
    info:
      path: SetPoint/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UIBackgroundModes: [remote-notification]
        UIAppFonts:
          - Fraunces-Regular.ttf
          - Fraunces-Medium.ttf
          - Fraunces-Italic.ttf
        NSHealthShareUsageDescription: "SetPoint reads your heart-rate variability and resting heart rate to notice when you may be under-fuelled, and your body weight to track progress toward your goal."
        NSCameraUsageDescription: "Take a photo of a meal to log it."
        NSPhotoLibraryUsageDescription: "Attach a photo of a meal to log it."
        SentryDSN: $(SENTRY_DSN)
        CFBundleURLTypes:
          - CFBundleURLName: com.setpoint.app
            CFBundleURLSchemes: [setpoint]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.setpoint.app
        ENABLE_PREVIEWS: YES
        # Sentry DSN for crash reporting (a public client key, not a secret).
        # Empty = reporting off.
        SENTRY_DSN: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: SetPoint/SetPoint.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - target: SetPointWidgets
        embed: true
      - sdk: ActivityKit.framework
      - sdk: HealthKit.framework
      - package: Sentry

  SetPointWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SetPointWidgets
        excludes:
          - Info.plist
      - path: SetPoint/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.setpoint.app.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SetPointWidgets/Info.plist
        SKIP_INSTALL: YES
    dependencies:
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  SetPointTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SetPointTests
    dependencies:
      - target: SetPoint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.setpoint.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SetPoint:
    build:
      targets:
        SetPoint: all
        SetPointWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SetPointTests
