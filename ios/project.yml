name: SetPoint

options:
  bundleIdPrefix: com.michaelhalperin.setpointapp
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, he, Base]
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "14"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(SETPOINT_TEAM_ID)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.28.0

targets:
  SetPoint:
    type: application
    platform: iOS
    sources:
      - path: SetPoint
        excludes:
          - Info.plist
    info:
      path: SetPoint/Info.plist
      properties:
        CFBundleDisplayName: SetPoint
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UIBackgroundModes: [remote-notification]
        UIUserInterfaceStyle: Dark
        NSHealthShareUsageDescription: "SetPoint reads your height, weight, age and sex to set daily targets, and your body weight to track progress. Heart-rate variability and resting heart rate are optional: they may slightly adjust a check-in that is already due from a missed meal. They never diagnose under-fueling on their own."
        NSHealthUpdateUsageDescription: "SetPoint writes meals you log (calories, protein, carbs and fat) into Apple Health so they stay in one place. Weight you log in SetPoint can be written too if you turn that on."
        NSCalendarsFullAccessUsageDescription: "SetPoint reads only when you are busy. Event titles, locations and who is invited never leave this phone."
        NSCalendarsUsageDescription: "SetPoint reads only when you are busy. Event titles, locations and who is invited never leave this phone."
        LSApplicationQueriesSchemes: ["x-apple-health"]
        NSCameraUsageDescription: "Take a photo of a meal or scan a barcode to log it."
        NSPhotoLibraryUsageDescription: "Attach a photo of a meal to log it."
        NSLocationWhenInUseUsageDescription: "Find places near you with a dish that fits what you still need. Your location is used for that search only and isn't stored."
        SentryDSN: $(SENTRY_DSN)
        CFBundleURLTypes:
          - CFBundleURLName: com.michaelhalperin.setpointapp
            CFBundleURLSchemes: [setpoint]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelhalperin.setpointapp
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        # Sentry DSN for crash reporting (a public client key, not a secret).
        # Empty = reporting off.
        SENTRY_DSN: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: SetPoint/SetPoint.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: SetPoint/SetPointRelease.entitlements
    dependencies:
      - target: SetPointWidgets
        embed: true
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
      - sdk: HealthKit.framework
      - sdk: EventKit.framework
      - sdk: VisionKit.framework
      - sdk: StoreKit.framework
      - package: Sentry

  SetPointWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SetPointWidgets
        excludes:
          - Info.plist
      - path: SetPoint/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelhalperin.setpointapp.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SetPointWidgets/Info.plist
        SKIP_INSTALL: YES
    entitlements:
      path: SetPointWidgets/SetPointWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.michaelhalperin.setpointapp
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.michaelhalperin.setpointapp
    dependencies:
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
      - sdk: SwiftUI.framework

  SetPointTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SetPointTests
    dependencies:
      - target: SetPoint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelhalperin.setpointapp.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SetPoint:
    build:
      targets:
        SetPoint: all
        SetPointWidgets: all
    run:
      config: Debug
      storeKitConfiguration: Config/SetPoint.storekit
    test:
      config: Debug
      targets:
        - SetPointTests
